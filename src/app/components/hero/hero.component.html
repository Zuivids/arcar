<div class="hero">
  <!-- Animated background layers -->
  <div class="hero-bg">
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow--left"></div>
    <div class="bg-glow bg-glow--right"></div>
    <div class="bg-lines">
      @for (i of [1,2,3,4,5,6]; track i) {
        <div class="line" [style.animationDelay]="(i * 0.15) + 's'"></div>
      }
    </div>
  </div>

  <!-- Content -->
  <div class="hero-content container">
    <div class="hero-text">
      <h1 class="hero-custom-title">{{ 'hero.custom_title' | translate }}</h1>

      <!-- CTAs -->
      <div class="hero-actions">
        <button class="btn-primary hero-btn" (click)="scrollTo('contact')">
          <span>{{ 'hero.cta_primary' | translate }}</span>
          <span class="material-symbols-rounded">arrow_forward</span>
        </button>
        <button class="btn-secondary hero-btn" (click)="scrollTo('services')">
          {{ 'hero.cta_secondary' | translate }}
        </button>
      </div>
    </div>

    <div class="hero-pricelist">
      <img src="/pricelist.jpeg" alt="ARCAR price list" />
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="scroll-indicator" (click)="scrollTo('about')">
    <div class="scroll-line"></div>
    <span class="material-symbols-rounded">keyboard_arrow_down</span>
  </div>
</div>

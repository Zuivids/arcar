<div class="hero">
  <!-- Animated background layers -->
  <div class="hero-bg">
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow--left"></div>
    <div class="bg-glow bg-glow--right"></div>
    <div class="bg-lines">
      @for (i of [1,2,3,4,5,6]; track i) {
        <div class="line" [style.animationDelay]="(i * 0.15) + 's'"></div>
      }
    </div>
  </div>

  <!-- Content -->
  <div class="hero-content container">
    <div class="hero-text">
      <!-- Tagline -->
      <div class="hero-tagline">
        <span class="tagline-dot"></span>
        {{ 'hero.tagline' | translate }}
        <span class="tagline-dot"></span>
      </div>

      <!-- Headline -->
      <h1 class="hero-title">
        <span class="title-line title-line--1">{{ 'hero.title_1' | translate }}</span>
        <span class="title-line title-line--2">{{ 'hero.title_2' | translate }}</span>
      </h1>

      <!-- Subtitle -->
      <p class="hero-subtitle">{{ 'hero.subtitle' | translate }}</p>

      <!-- CTAs -->
      <div class="hero-actions">
        <button class="btn-primary hero-btn" (click)="scrollTo('contact')">
          <span>{{ 'hero.cta_primary' | translate }}</span>
          <span class="material-symbols-rounded">arrow_forward</span>
        </button>
        <button class="btn-secondary hero-btn" (click)="scrollTo('services')">
          {{ 'hero.cta_secondary' | translate }}
        </button>
      </div>

      <!-- Badge row -->
      <div class="hero-badge-row">
        <div class="hero-badge">
          <span class="material-symbols-rounded">verified</span>
          {{ 'hero.badge' | translate }}
        </div>
        <div class="hero-stats">
          <div class="stat"><strong>5000+</strong><span>Klienti</span></div>
          <div class="stat-sep"></div>
          <div class="stat"><strong>9</strong><span>Pakalpojumi</span></div>
          <div class="stat-sep"></div>
          <div class="stat"><strong>100%</strong><span>Garantija</span></div>
        </div>
      </div>
    </div>

    <!-- Side decorative -->
    <div class="hero-visual">
      <div class="visual-ring visual-ring--1"></div>
      <div class="visual-ring visual-ring--2"></div>
      <div class="visual-ring visual-ring--3"></div>
      <div class="visual-center">
        <span class="material-symbols-rounded visual-icon">car_repair</span>
        <div class="visual-glow"></div>
      </div>
      <div class="visual-label">ARCAR</div>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="scroll-indicator" (click)="scrollTo('about')">
    <div class="scroll-line"></div>
    <span class="material-symbols-rounded">keyboard_arrow_down</span>
  </div>
</div>

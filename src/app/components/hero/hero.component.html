<div class="hero">
  <!-- Animated background layers -->
  <div class="hero-bg">
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow--left"></div>
    <div class="bg-glow bg-glow--right"></div>
    <div class="bg-lines">
      @for (i of [1,2,3,4,5,6]; track i) {
        <div class="line" [style.animationDelay]="(i * 0.15) + 's'"></div>
      }
    </div>
  </div>

  <!-- Content -->
  <div class="hero-content container">
    <div class="hero-pricelist">
      <div class="hero-pricelist-item hero-pricelist-wide">
        <app-tire-card />
      </div>
      <div class="hero-pricelist-item">
        <app-price-card [titleLines]="dpfTitle" [subtitleKeys]="dpfSubtitle" [offers]="dpfOffers" [showFooter]="true" />
      </div>
      <div class="hero-pricelist-item">
        <app-price-card [titleLines]="acTitle" [subtitleKeys]="acSubtitle" [offers]="acOffers" [uppercaseTitles]="false" />
      </div>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="scroll-indicator" (click)="scrollTo('about')">
    <div class="scroll-line"></div>
    <span class="material-symbols-rounded">keyboard_arrow_down</span>
  </div>
</div>

<nav class="navbar" [class.scrolled]="scrolled" [class.menu-open]="menuOpen">
  <div class="nav-inner container">

    <!-- Logo -->
    <div class="nav-logo" (click)="scrollTo('home')">
      <span class="logo-ar">AR</span><span class="logo-car">CAR</span>
      <span class="logo-dot"></span>
    </div>

    <!-- Desktop Links -->
    <ul class="nav-links">
      @for (link of navLinks; track link.id) {
        <li>
          <button class="nav-link" (click)="scrollTo(link.id)">
            {{ link.key | translate }}
          </button>
        </li>
      }
    </ul>

    <!-- Right side -->
    <div class="nav-actions">
      <!-- Language Toggle -->
      <div class="lang-toggle">
        <button
          class="lang-btn"
          [class.active]="langSvc.currentLang() === 'lv'"
          (click)="langSvc.setLang('lv')"
        >LV</button>
        <span class="lang-divider"></span>
        <button
          class="lang-btn"
          [class.active]="langSvc.currentLang() === 'ru'"
          (click)="langSvc.setLang('ru')"
        >RU</button>
      </div>

      <!-- CTA -->
      <button class="nav-cta btn-primary" (click)="scrollTo('contact')">
        {{ 'nav.book' | translate }}
      </button>

      <!-- Hamburger -->
      <button class="hamburger" (click)="toggleMenu()" [class.open]="menuOpen" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <div id="nav-info">
    <div class="container nav-info-inner">
      <span class="nav-info-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 1a11 11 0 1 0 11 11A11 11 0 0 0 12 1zm0 20a9 9 0 1 1 9-9 9 9 0 0 1-9 9zm.5-9.59V7h-1v5.41l4.24 2.52.5-.87-3.74-2.16z"></path>
        </svg>
        {{ 'nav.workdays_short' | translate }} : 09:00 - 19:00
      </span>
      <a href="tel:+37128909098">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.62 10.79a15.053 15.053 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.05-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1C10.07 21 3 13.93 3 5a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.24.2 2.45.57 3.57a1 1 0 0 1-.24 1.05l-2.21 2.17z"></path>
        </svg>
        +37128909098
      </a>
      <a href="mailto:siaarcar@gmail.com">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 2l-8 5-8-5h16zm0 12H4V8l8 5 8-5v10z"></path>
        </svg>
        siaarcar&#64;gmail.com
      </a>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="menuOpen">
    <ul class="mobile-links">
      @for (link of navLinks; track link.id) {
        <li>
          <button class="mobile-link" (click)="scrollTo(link.id)">
            {{ link.key | translate }}
          </button>
        </li>
      }
    </ul>
    <div class="mobile-actions">
      <div class="lang-toggle">
        <button class="lang-btn" [class.active]="langSvc.currentLang() === 'lv'" (click)="langSvc.setLang('lv')">LV</button>
        <span class="lang-divider"></span>
        <button class="lang-btn" [class.active]="langSvc.currentLang() === 'ru'" (click)="langSvc.setLang('ru')">RU</button>
      </div>
      <button class="btn-primary mobile-cta" (click)="scrollTo('contact')">
        {{ 'nav.book' | translate }}
      </button>
    </div>
  </div>
</nav>

<div class="about section">
  <!-- Background accent -->
  <div class="about-bg-accent"></div>

  <div class="container">
    <div class="about-grid">
      <!-- Left: Content -->
      <div class="about-content">
        <div scrollReveal>
          <span class="section-label">{{ 'about.label' | translate }}</span>
          <h2 class="section-title">
            {{ 'about.title_1' | translate }}<br>
            <span>{{ 'about.title_2' | translate }}</span>
          </h2>
          <div class="divider"></div>
        </div>

        <p class="about-text" scrollReveal [style.transitionDelay]="'0.15s'">
          {{ 'about.p1' | translate }}
        </p>
        <p class="about-text" scrollReveal [style.transitionDelay]="'0.25s'">
          {{ 'about.p2' | translate }}
        </p>

        <div class="about-actions" scrollReveal [style.transitionDelay]="'0.35s'">
          <button class="btn-primary" (click)="scrollTo('contact')">
            {{ 'about.cta' | translate }}
            <span class="material-symbols-rounded">arrow_forward</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

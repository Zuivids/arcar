<div class="whyus section">
  <div class="whyus-bg">
    <div class="whyus-accent-line"></div>
  </div>

  <div class="container">
    <!-- Header -->
    <div class="whyus-header" scrollReveal>
      <span class="section-label">{{ 'whyus.label' | translate }}</span>
      <h2 class="section-title">
        {{ 'whyus.title_1' | translate }}<br>
        <span>{{ 'whyus.title_2' | translate }}</span>
      </h2>
    </div>

    <!-- Features Grid -->
    <div class="features-grid">
      @for (feat of features; track feat.titleKey; let i = $index) {
        <div
          class="feature-item"
          scrollReveal
          [style.transitionDelay]="feat.delay"
        >
          <div class="feature-icon-wrap">
            <span class="material-symbols-rounded feature-icon">{{ feat.icon }}</span>
          </div>
          <div class="feature-body">
            <h3 class="feature-title">{{ feat.titleKey | translate }}</h3>
            <p class="feature-desc">{{ feat.descKey | translate }}</p>
          </div>
          <div class="feature-number">{{ (i + 1).toString().padStart(2, '0') }}</div>
        </div>
      }
    </div>
  </div>
</div>
